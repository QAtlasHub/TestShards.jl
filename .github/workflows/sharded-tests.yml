        continue-on-error: true
        with:
          path: ${{ inputs.test-root }}/.ci-out
          key: testshards-evidence-${{ inputs.artifact-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}-s5
          fail-on-cache-miss: false
      - name: stash s5
        if: ${{ inputs.shards >= 5 }}
        continue-on-error: true
        run: |
          d="${{ inputs.test-root }}/.ci-out"
          mkdir -p cache-parts/s5
          [ -d "$d" ] && { mv "$d"/* cache-parts/s5/ 2>/dev/null || true; rm -rf "$d"; }
          echo "s5: hit='${{ steps.ev5.outputs.cache-hit }}' files=$(ls cache-parts/s5 2>/dev/null | wc -l)"
      - uses: actions/cache/restore@v6
        id: ev6
        if: ${{ inputs.shards >= 6 }}
        continue-on-error: true
        with:
          path: ${{ inputs.test-root }}/.ci-out
          key: testshards-evidence-${{ inputs.artifact-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}-s6
          fail-on-cache-miss: false
      - name: stash s6
        if: ${{ inputs.shards >= 6 }}
        continue-on-error: true
        run: |
          d="${{ inputs.test-root }}/.ci-out"
          mkdir -p cache-parts/s6
          [ -d "$d" ] && { mv "$d"/* cache-parts/s6/ 2>/dev/null || true; rm -rf "$d"; }
          echo "s6: hit='${{ steps.ev6.outputs.cache-hit }}' files=$(ls cache-parts/s6 2>/dev/null | wc -l)"
      - uses: actions/cache/restore@v6
        id: ev7
        if: ${{ inputs.shards >= 7 }}
        continue-on-error: true
        with:
          path: ${{ inputs.test-root }}/.ci-out
          key: testshards-evidence-${{ inputs.artifact-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}-s7
          fail-on-cache-miss: false
      - name: stash s7
        if: ${{ inputs.shards >= 7 }}
        continue-on-error: true
        run: |
          d="${{ inputs.test-root }}/.ci-out"
          mkdir -p cache-parts/s7
          [ -d "$d" ] && { mv "$d"/* cache-parts/s7/ 2>/dev/null || true; rm -rf "$d"; }
          echo "s7: hit='${{ steps.ev7.outputs.cache-hit }}' files=$(ls cache-parts/s7 2>/dev/null | wc -l)"
      - uses: actions/cache/restore@v6
        id: ev8
        if: ${{ inputs.shards >= 8 }}
        continue-on-error: true
        with:
          path: ${{ inputs.test-root }}/.ci-out
          key: testshards-evidence-${{ inputs.artifact-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}-s8
          fail-on-cache-miss: false
      - name: stash s8
        if: ${{ inputs.shards >= 8 }}
        continue-on-error: true
        run: |
          d="${{ inputs.test-root }}/.ci-out"
          mkdir -p cache-parts/s8
          [ -d "$d" ] && { mv "$d"/* cache-parts/s8/ 2>/dev/null || true; rm -rf "$d"; }
          echo "s8: hit='${{ steps.ev8.outputs.cache-hit }}' files=$(ls cache-parts/s8 2>/dev/null | wc -l)"
      - uses: actions/cache/restore@v6
        id: ev9
        if: ${{ inputs.shards >= 9 }}
        continue-on-error: true
        with:
          path: ${{ inputs.test-root }}/.ci-out
          key: testshards-evidence-${{ inputs.artifact-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}-s9
          fail-on-cache-miss: false
      - name: stash s9
        if: ${{ inputs.shards >= 9 }}
        continue-on-error: true
        run: |
          d="${{ inputs.test-root }}/.ci-out"
          mkdir -p cache-parts/s9
          [ -d "$d" ] && { mv "$d"/* cache-parts/s9/ 2>/dev/null || true; rm -rf "$d"; }
          echo "s9: hit='${{ steps.ev9.outputs.cache-hit }}' files=$(ls cache-parts/s9 2>/dev/null | wc -l)"
      - uses: actions/cache/restore@v6
        id: ev10
        if: ${{ inputs.shards >= 10 }}
        continue-on-error: true
        with:
          path: ${{ inputs.test-root }}/.ci-out
          key: testshards-evidence-${{ inputs.artifact-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}-s10
          fail-on-cache-miss: false
      - name: stash s10
        if: ${{ inputs.shards >= 10 }}
        continue-on-error: true
        run: |
          d="${{ inputs.test-root }}/.ci-out"
          mkdir -p cache-parts/s10
          [ -d "$d" ] && { mv "$d"/* cache-parts/s10/ 2>/dev/null || true; rm -rf "$d"; }
          echo "s10: hit='${{ steps.ev10.outputs.cache-hit }}' files=$(ls cache-parts/s10 2>/dev/null | wc -l)"
      - uses: actions/cache/restore@v6
        id: ev11
        if: ${{ inputs.shards >= 11 }}
        continue-on-error: true
        with:
          path: ${{ inputs.test-root }}/.ci-out
          key: testshards-evidence-${{ inputs.artifact-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}-s11
          fail-on-cache-miss: false
      - name: stash s11
        if: ${{ inputs.shards >= 11 }}
        continue-on-error: true
        run: |
          d="${{ inputs.test-root }}/.ci-out"
          mkdir -p cache-parts/s11
          [ -d "$d" ] && { mv "$d"/* cache-parts/s11/ 2>/dev/null || true; rm -rf "$d"; }
          echo "s11: hit='${{ steps.ev11.outputs.cache-hit }}' files=$(ls cache-parts/s11 2>/dev/null | wc -l)"
      - uses: actions/cache/restore@v6
        id: ev12
        if: ${{ inputs.shards >= 12 }}
        continue-on-error: true
        with:
          path: ${{ inputs.test-root }}/.ci-out
          key: testshards-evidence-${{ inputs.artifact-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}-s12
          fail-on-cache-miss: false
      - name: stash s12
        if: ${{ inputs.shards >= 12 }}
        continue-on-error: true
        run: |
          d="${{ inputs.test-root }}/.ci-out"
          mkdir -p cache-parts/s12
          [ -d "$d" ] && { mv "$d"/* cache-parts/s12/ 2>/dev/null || true; rm -rf "$d"; }
          echo "s12: hit='${{ steps.ev12.outputs.cache-hit }}' files=$(ls cache-parts/s12 2>/dev/null | wc -l)"
      - uses: actions/cache/restore@v6
        id: ev13
        if: ${{ inputs.shards >= 13 }}
        continue-on-error: true
        with:
          path: ${{ inputs.test-root }}/.ci-out
          key: testshards-evidence-${{ inputs.artifact-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}-s13
          fail-on-cache-miss: false
      - name: stash s13
        if: ${{ inputs.shards >= 13 }}
        continue-on-error: true
        run: |
          d="${{ inputs.test-root }}/.ci-out"
          mkdir -p cache-parts/s13
          [ -d "$d" ] && { mv "$d"/* cache-parts/s13/ 2>/dev/null || true; rm -rf "$d"; }
          echo "s13: hit='${{ steps.ev13.outputs.cache-hit }}' files=$(ls cache-parts/s13 2>/dev/null | wc -l)"
      - uses: actions/cache/restore@v6
        id: ev14
        if: ${{ inputs.shards >= 14 }}
        continue-on-error: true
        with:
          path: ${{ inputs.test-root }}/.ci-out
          key: testshards-evidence-${{ inputs.artifact-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}-s14
          fail-on-cache-miss: false
      - name: stash s14
        if: ${{ inputs.shards >= 14 }}
        continue-on-error: true
        run: |
          d="${{ inputs.test-root }}/.ci-out"
          mkdir -p cache-parts/s14
          [ -d "$d" ] && { mv "$d"/* cache-parts/s14/ 2>/dev/null || true; rm -rf "$d"; }
          echo "s14: hit='${{ steps.ev14.outputs.cache-hit }}' files=$(ls cache-parts/s14 2>/dev/null | wc -l)"
      - uses: actions/cache/restore@v6
        id: ev15
        if: ${{ inputs.shards >= 15 }}
        continue-on-error: true
        with:
          path: ${{ inputs.test-root }}/.ci-out
          key: testshards-evidence-${{ inputs.artifact-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}-s15
          fail-on-cache-miss: false
      - name: stash s15
        if: ${{ inputs.shards >= 15 }}
        continue-on-error: true
        run: |
          d="${{ inputs.test-root }}/.ci-out"
          mkdir -p cache-parts/s15
          [ -d "$d" ] && { mv "$d"/* cache-parts/s15/ 2>/dev/null || true; rm -rf "$d"; }
          echo "s15: hit='${{ steps.ev15.outputs.cache-hit }}' files=$(ls cache-parts/s15 2>/dev/null | wc -l)"
      - uses: actions/cache/restore@v6
        id: ev16
        if: ${{ inputs.shards >= 16 }}
        continue-on-error: true
        with:
          path: ${{ inputs.test-root }}/.ci-out
          key: testshards-evidence-${{ inputs.artifact-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}-s16
          fail-on-cache-miss: false
      - name: stash s16
        if: ${{ inputs.shards >= 16 }}
        continue-on-error: true
        run: |
          d="${{ inputs.test-root }}/.ci-out"
          mkdir -p cache-parts/s16
          [ -d "$d" ] && { mv "$d"/* cache-parts/s16/ 2>/dev/null || true; rm -rf "$d"; }
          echo "s16: hit='${{ steps.ev16.outputs.cache-hit }}' files=$(ls cache-parts/s16 2>/dev/null | wc -l)"

      - name: Every unit ran, exactly once
        run: |
          set -euo pipefail
          mkdir -p parts cache-parts
          find parts cache-parts -name 'shard-*.tsv' -exec cat {} + | sort -u > all-shards.tsv || : > all-shards.tsv
          find parts cache-parts -name 'ran-*.tsv'   -exec cat {} + | sort -u > all-ran.tsv    || : > all-ran.tsv
          find parts cache-parts -name 'ended-*.tsv' -exec cat {} + | sort -u > all-ended.tsv  || : > all-ended.tsv
          # tee, not redirect: when this fails it is a required check going red, and the
          # reason has to be in the log people open first, not only in the run summary.
          julia --startup-file=no --project="$RUNNER_TEMP/tsenv" -e '
            using TestShards
            exit(TestShards.completeness_cli(ARGS))' all-shards.tsv all-ran.tsv \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Merge every shard's records into one ordered document
        run: |
          set -euo pipefail
          # Every record carries `index`, its position in the FULL observed sequence and
          # identical in every shard, so ordering on it reassembles source order across jobs.
          find parts -name 'records-*.jsonl' -exec cat {} + > raw.jsonl || : > raw.jsonl
          # Inlined rather than kept as a script file: this is a REUSABLE workflow, so a
          # checkout here would fetch the CALLER's repository, which has no script of ours.
          python3 - raw.jsonl records.jsonl <<'MERGE' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib, sys
          src, dst = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          rs = [json.loads(l) for l in src.read_text().splitlines() if l.strip()]
          rs.sort(key=lambda r: r["index"])
          dst.write_text("".join(json.dumps(r) + "\n" for r in rs))
          print("### Units\n")
          print("| unit | shard | seconds | pass | fail | error |")
          print("|---|---|--:|--:|--:|--:|")
          for r in rs:
              print(f"| `{r['key']}` | {r['shard'] or 'all'} | {r['duration']:.2f} | "
                    f"{r['npass']} | {r['nfail']} | {r['nerror']} |")
          MERGE
          echo "Merged $(wc -l < records.jsonl) unit records."

      - name: Upload the merged records
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-records
          path: records.jsonl
          retention-days: 30
          if-no-files-found: warn

      # What the numbers mean, rather than what they are: how many shards this suite can
      # actually use, what is stopping it using more, and which section of the heaviest unit
      # to cut. Best-effort — a diagnosis must never be the thing that fails a run.
      - name: Diagnose the shape of the suite
        if: ${{ inputs.diagnose }}
        continue-on-error: true
        env:
          SHARDS: ${{ inputs.shards }}
          FIXED: ${{ inputs.fixed-cost-seconds }}
          BUDGET: ${{ inputs.concurrency-budget }}
        run: |
          set -euo pipefail
          find parts -name 'timings-*.tsv'  -exec cat {} + | sort -u > all-timings.tsv  || : > all-timings.tsv
          find parts -name 'sections-*.tsv' -exec cat {} + | sort -u > all-sections.tsv || : > all-sections.tsv
          # all-shards.tsv is already here: the completeness step above builds it.
          [ -s all-timings.tsv ] || { echo "No timings yet — nothing to diagnose."; exit 0; }
          julia --startup-file=no --project="$RUNNER_TEMP/tsenv" -e '
            using TestShards
            exit(TestShards.diagnose_cli([
                "all-timings.tsv", "all-sections.tsv", "all-shards.tsv",
                "--shards", ENV["SHARDS"], "--fixed", ENV["FIXED"],
                "--ends", "all-ended.tsv", "--budget", ENV["BUDGET"],
            ]))' >> "$GITHUB_STEP_SUMMARY"

  timings:
    name: Record timing history
    needs: test
    if: ${{ inputs.record-timings && (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.test.result == 'success') }}
    runs-on: ${{ fromJSON(inputs.helper-runner) }}
    permissions:
      contents: write                   # force-pushes the ci-timings orphan branch
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: ${{ inputs.submodules }}
      - uses: actions/download-artifact@v8
        with:
          path: parts
          pattern: ${{ inputs.artifact-prefix }}-out-*
      # This run REPLACES the history rather than being merged into it. On a green run of the
      # default branch every unit ran exactly once across the shards, so this run's timings are
      # not an update to the suite — they ARE the suite. Merging instead keeps a row for every
      # test file that ever existed, and a deleted unit then goes on inflating `serial`, the
      # bin packing and the diagnosis forever, with nothing to notice it. Renaming three files
      # is what surfaced this.
      - name: Replace the ci-timings orphan branch with this run's measurements
        run: |
          set -euo pipefail
          mkdir -p merged
          : > merged/previous.tsv
          if git ls-remote --exit-code --heads origin ci-timings >/dev/null 2>&1; then
            git fetch --depth=1 origin ci-timings
            git show FETCH_HEAD:timings.tsv > merged/previous.tsv 2>/dev/null || : > merged/previous.tsv
          fi
          find parts -name 'timings-*.tsv' -exec cat {} + > merged/timings.tsv || : > merged/timings.tsv
          awk -F'\t' 'NF==2{t[$1]=$2} END{for (k in t) print k"\t"t[k]}' \
            merged/timings.tsv | sort > merged/final.tsv
          rows=$(wc -l < merged/final.tsv)
          if [ "$rows" -lt 1 ]; then
            echo "::error::0 timing rows from a green run — TESTSHARDS_OUT is not reaching the sandbox, and the shards would round-robin forever without saying so."
            exit 1
          fi
          # Say what was dropped. Pruning is the point, but a silent prune and a shard that
          # failed to report look identical from here.
          dropped=$(comm -23 <(cut -f1 merged/previous.tsv | sort -u) <(cut -f1 merged/final.tsv) || true)
          if [ -n "$dropped" ]; then
            echo "Units gone since the last recorded run (dropped from the history):"
            printf '  %s\n' $dropped
          fi
          echo "Recorded $rows timing rows."
          tmp=$(mktemp -d); cp merged/final.tsv "$tmp/timings.tsv"; cd "$tmp"
          git init -q
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git checkout -q -b ci-timings
          git add timings.tsv
          git commit -q -m "ci: refresh test timings ($rows rows) [skip ci]"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-timings

  # The one required-check-shaped job. It waits on `collect` as well as on the shards, because
  # "every shard passed" and "every unit ran" are different claims and only the second one
  # survives a shard dying after it claimed work.
  gate:
    name: All shards passed
    needs: [test, collect]
    if: always()
    runs-on: ${{ fromJSON(inputs.helper-runner) }}
    steps:
      - run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::one or more shards failed (${{ needs.test.result }})"; exit 1
          fi
          if [ "${{ needs.collect.result }}" != "success" ]; then
            echo "::error::the shards passed but the run was not complete or could not be verified (collect: ${{ needs.collect.result }})"; exit 1
          fi
          echo "All shards green, and every unit ran exactly once."
