name: Sharded tests

# Reusable: the whole sharded-test vertical, so a consumer repository carries none of it.
#
# A repo that adopts this has no shard-planning script, no test-file manifest, no
# coverage-merge job and no timing-recording job. It has two things:
#
#   test/runtests.jl        using MyPackage, TestShards
#                           TestShards.@shard begin
#                               include("core/a.jl")
#                               ...
#                           end
#
#   .github/workflows/CI.yml
#                           jobs:
#                             test:
#                               uses: QAtlasHub/TestShards.jl/.github/workflows/sharded-tests.yml@main
#                               with: { shards: 8, runner: '["self-hosted","my-pool"]' }
#                               secrets:
#                                 CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
#
# THERE IS NO PLANNING JOB. Each shard decides what it owns from the same timing history, using
# the same deterministic assignment, so nothing before the tests has to know what the suite
# contains in order to split it — no Julia runs first, and the matrix carries labels only.
#
#   labels    the shard labels, and the ONE read of the timing history, handed on as an
#             artifact. It reads rather than plans: it never learns what the suite contains.
#             Reading it once is load-bearing — "same history" is what makes the shards'
#             independent assignments agree, and a per-shard fetch let one transient failure
#             put a single shard on a different one. See the comment on the step.
#   test      one job per shard; each writes its own records (JSONL) and timings (TSV).
#   collect   merge every shard's coverage into ONE Codecov upload, and every shard's records
#             into one ordered document. This is the part otherwise hand-written per repo.
#   timings   on the default branch only, fold the timings into the `ci-timings` orphan branch.
#             A PR must never rewrite the history it was planned against.
#   gate      one required-check-shaped job, green iff every shard passed AND every unit ran
#             exactly once. Those are different claims: a shard can pass having quietly run
#             nothing, which is what `steal` makes possible and what `collect` checks.
#
# With no history the shards fall back to round-robin, so a fresh repo is correct from the
# first run and balances itself from the second push onward.

on:
  workflow_call:
    inputs:
      shards:
        description: >
          Number of shards. `1` is not "one of one shard" — it means run the suite WHOLE, in one
          job, with nothing split and nothing skipped. Everything else still happens: the
          exactly-once check, the merged coverage report, the diagnosis. A suite with one unit,
          or one adopting this for the report rather than for the split, is a real thing to be,
          and `shards: 1` is what a reader writes to say so.
        type: number
        default: 8
      runner:
        description: 'runs-on as JSON: ''"ubuntu-latest"'' or ''["self-hosted","my-pool"]'''
        type: string
        default: '"ubuntu-latest"'
      helper-runner:
        description: 'Runner for the small merge jobs. Keep hosted: they need no depot.'
        type: string
        default: '"ubuntu-latest"'
      julia-version:
        type: string
        default: '1'
      test-root:
        description: 'Directory holding runtests.jl, relative to the repository.'
        type: string
        default: 'test'
      submodules:
        description: >
          Passed to every `actions/checkout` this workflow runs: `false`, `true`, or `recursive`.
          A project whose manifest carries a dev path into a submodule needs this and cannot
          adopt the workflow without it — the checkout stops fetching what the manifest points
          at, and every shard then dies with `Build path for X does not exist`, which reads like
          a broken manifest and is not.

          Handed to EVERY checkout rather than to the jobs that look like they need it: which
          part of a caller's repository lives in a submodule is the caller's business, and this
          workflow does not know it. The cost of the uniform answer is a submodule fetch in two
          small helper jobs; the cost of the clever one is a job that fails for a reason nothing
          here can explain.
        type: string
        default: 'false'
      coverage:
        type: boolean
        default: true
      coverage-upload:
        description: >
          Whether this workflow sends the merged report to Codecov. Set it false when you upload
          it yourself with `actions/upload-coverage` — a PRIVATE caller has to, because a secret
          does not survive the call into a reusable workflow from one (measured against two
          public callers, one of them in another organisation, which both receive it).

          Without this input such a caller gets a warning about a missing token on every single
          run, for a token it deliberately did not send — which is how a warning stops being
          read. The merge still happens and the `<artifact-prefix>-lcov` artifact is still
          published either way; only the sending is yours.
        type: boolean
        default: true
      diagnose:
        description: 'Report what the timing history says about the shape of the suite.'
        type: boolean
        default: true
      cache:
        description: >
          Cache the Julia depot between runs with `julia-actions/cache`. `true` is right for a
          HOSTED runner, whose depot is gone at the end of the job. Set it FALSE on a pool whose
          depot already persists: there the restore is a no-op and the SAVE is not.

          Measured on one green eight-shard run (FunctionMeasures.jl 30826019824): 44–182 s of
          post-step per shard, ≈620 s of runner time per run, against 58–268 s of actual testing —
          a cache costing about what the tests cost, for a depot that was already on the box. And
          when it does not merely cost, it hangs: three jobs on 2026-08-03 whose test step
          SUCCEEDED went red or never finished in that post-step, one of them holding a runner for
          114 minutes, which reads downstream as ordinary queueing. See #62.
        type: boolean
        default: true
      steal:
        description: >
          Claim work instead of being assigned it. Each shard runs whatever is still unclaimed,
          so one that starts late takes less rather than delaying everyone. Worth it only when
          the diagnosis says QueueBound: it costs a round trip per unit, and the completeness
          gate below exists because a shard that dies after claiming leaves a hole.
        type: boolean
        default: false
      stagger-seconds:
        description: >
          Delay shard sK by (K-1) x this before it starts, so the arrival spread becomes a
          CONTROLLED variable. The real queue cannot be controlled, and comparing ownership
          strategies across runs that drew different spreads compares the queue, not the
          strategies. Zero in normal use.
        type: string
        default: '0'
      steal-min-seconds:
        description: >
          Units cheaper than this stay statically assigned when stealing: below it a round trip
          costs more than the unit does. Needs a timing history to know which those are.
        type: string
        default: '0'
      prebuild:
        description: >
          Precompile ONCE in its own job and hand the result to the shards, instead of every
          shard precompiling the same commit for itself. Measured on a 16-shard suite, the
          package under test cost ~219s of precompilation inside EVERY shard's test step —
          ~3,400 runner-seconds a run, for one answer.
          It is a TRADE, not a win: the build is serialised in front of the shards, so it buys
          runner time and costs a little wall clock. Off by default; which side you want is a
          fact about your account, not about your suite.
          HOSTED RUNNERS ONLY. Julia keys a package's compiled cache on its absolute source
          path, and `$GITHUB_WORKSPACE` is the same on every hosted runner but carries the
          runner's own name on a self-hosted pool — so there the shards rebuild the package
          anyway, after paying for the transfer. Dependencies cross either way, and a
          self-hosted pool sharing one depot already has them.
        type: boolean
        default: false
      concurrency-budget:
        description: >
          How many jobs this ACCOUNT can run at once. Shard counts are chosen per repository and
          hosted runners are budgeted per organisation, so a knee of ten is the wrong number to
          act on when eight is what you can actually get: the surplus queues and adds fixed
          costs without adding parallelism. Nothing in a test run can observe this, so the
          diagnosis only mentions it when you say so. 0 = unknown.
        type: string
        default: '0'
      fixed-cost-seconds:
        description: >
          Per-shard cost that does not shrink with more shards (checkout, depot restore,
          precompile). Leave at 0: the shards now report their own windows and the diagnosis
          MEASURES it. Set it only to ask what a hypothetical price would do to the curve.
          Only scales the reported cost; the knee is the same either way.
        type: string
        default: '0'
      artifact-prefix:
        description: >
          Prefix for every artifact this run publishes. Set it when ONE workflow calls this
          more than once — a matrix over Julia
          versions, say — because the two calls share a run, and without a discriminator they
          collide on `upload-artifact`, which rejects a duplicate name. The second call then
          fails on an upload AFTER its tests passed.

          The quieter half: both calls would also record to the same `ci-timings` branch, having
          measured DIFFERENT configurations. Whichever finishes last wins, silently, and every
          later run is planned against a history that is half one version and half the other.
          Nothing fails; the balance just stops meaning what it says. Give each call its own
          prefix, or use `record-timings: false` on the ones that should not own the history.
        type: string
        default: 'testshards'
      record-timings:
        description: >
          Whether this call records its measurements to the timing branch. Turn it off on the
          secondary legs of a multi-version matrix: "both legs record" is not expressible as
          anything correct, since they measure different configurations.
        type: boolean
        default: true
      registries:
        description: >
          Registries the package resolves from, one per line — a bare name for a registry Pkg
          knows (`General`) or a clone URL for an overlay. Each is added only if it is not
          already reachable, because re-adding an existing registry ERRORS rather than
          no-opping. Registries are depot-level, so adding them here reaches inside
          `Pkg.test`'s sandbox.

          Setting this ALSO refreshes every registry in every depot, which is the reason to set
          `registries: General` even for a package that needs nothing else: on a persistent
          self-hosted depot a registry that is present but STALE resolves fine and simply cannot
          see a version registered since it was last pulled.

          Needed by a repository whose dependencies resolve from a private overlay instead of
          `[sources]`. On a self-hosted pool the depot is persistent PER BOX and the boxes do
          not all carry the same registries, so the failure without this is PARTIAL — some
          shards resolve and others die with `expected package X to be registered`, on one
          commit. That reads as flake and is not.
        type: string
        default: ''
      testshards-spec:
        description: >
          How the collect job installs TestShards for its reporting steps (a `Pkg.add` argument
          list). The default takes the registered package, so a consumer's CI follows General
          rather than this repository's default branch. Override it to test an unreleased
          change: `url="https://github.com/QAtlasHub/TestShards.jl", rev="my-branch"`.
        type: string
        default: 'name="TestShards"'
      force-latest-compatible-version:
        description: >
          Passed to `julia-actions/julia-runtest`. The action's own default is `auto`, which
          means `true` on a CompatHelper or Dependabot pull request: every direct dependency is
          forced to the newest version its `[compat]` admits, so the bump is tested against what
          it now allows rather than against whatever the resolver would have picked anyway.

          Default `false` here, because on a package whose dependencies constrain EACH OTHER the
          forcing is applied to all of them at once and the result is over-constrained. It does
          not fail as a compat finding; it fails before any test runs, in the resolver
          (`Unsatisfiable requirements detected for ...`) or inside Pkg itself
          (`apply_force_latest_compatible_version!` reducing over an empty collection). What
          reaches the reader is a red CompatHelper PR that ran ZERO tests, on every such PR, for
          reasons that have nothing to do with the bump — and a CI-gated automerge chain
          downstream then never fires, so the same PR is reopened and stacks.

          `auto` is the right setting for a package whose dependencies are mutually independent,
          and this input is how such a repository asks for it back. Set it per repository, from
          whether its dependency graph actually admits a simultaneous latest.
        type: string
        default: 'false'
    secrets:
      CODECOV_TOKEN:
        required: false

# NO top-level `permissions:` here. In a called workflow each job requests what it needs and
# the CALLER's grant is the ceiling; a job asking for more than the caller granted makes the
# whole run fail to START (startup_failure), with no log to read. The caller must therefore
# grant `contents: write`, which `timings` needs to push the ci-timings orphan branch.

jobs:
  # The only thing computed before the tests is the LABELS s1..sN, because GitHub expressions
  # cannot build a range. No Julia and no checkout: which units a shard owns is decided inside
  # the shard, from the timing history.
  labels:
    name: Shard labels
    runs-on: ${{ fromJSON(inputs.helper-runner) }}
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      # WHETHER THE HISTORY EXISTS, DECIDED ONCE (issue #74). The shards must all use the SAME
      # assignment function; a per-shard decision about the history is exactly the divergence the
      # comment on the download below forbids. So the answer is computed here, in the one job that
      # knows, and every shard reads it.
      timings: ${{ steps.timings.outcome }}
    steps:
      - id: gen
        run: |
          set -euo pipefail
          n=${{ inputs.shards }}
          [ "$n" -ge 1 ] || { echo "::error::shards must be >= 1 (got $n)"; exit 1; }
          m=$(seq 1 "$n" | sed 's/^/"s/; s/$/"/' | paste -sd, -)
          echo "matrix=[$m]" >> "$GITHUB_OUTPUT"
          if [ "$n" -eq 1 ]; then
            echo "shards: 1 — the suite runs WHOLE in one job. No shard id is set, so nothing is skipped."
          else
            echo "Shards: [$m]"
          fi

      # The timing history is read ONCE, here, and handed to the shards as an artifact.
      #
      # It used to be fetched per shard, and that is not a detail. Every shard computes the same
      # total assignment function and skips what is not its own; exactly-once rests entirely on
      # every shard feeding that function the SAME history. A shard that falls back to
      # round-robin while the others use the history computes a DIFFERENT function, so some
      # units are claimed twice and others by nobody — at once, with every shard still green.
      #
      # Measured on this repository: seven shards printed `Loaded 23 timing rows`, the eighth
      # printed `No ci-timings branch yet` after a transient `git ls-remote` failure the old code
      # could not tell from an absent branch. Two units ran twice, two ran nowhere, and only the
      # completeness gate noticed.
      #
      # Reading it once removes the disagreement instead of detecting it, and closes a second
      # hole with it: `ci-timings` is force-pushed by the recording job, so shards starting
      # either side of a push to the default branch could read different histories even with
      # every fetch succeeding.
      - uses: actions/checkout@v7
        with:
          submodules: ${{ inputs.submodules }}

      # AN ACTION, not a `run:`, and the reason is where each one runs. #68 moved this into a
      # file so `read-history.test.sh` could put the SAME code in the states a consumer is in —
      # the no-history state cannot be reached from a run of this repository, which is how it
      # shipped broken (#54) and surfaced on the first adopter. That part was right.
      #
      # What could not work is a `run:`: a `run:` step in a REUSABLE WORKFLOW executes in the
      # CALLER's checkout, so `run: .github/scripts/read-history.sh` found the file here and
      # exited 127 on every consumer (#69: ParaLinearAlgebra.jl run 30959798081, five jobs red,
      # eight shards never started). An action's own files are fetched WITH it, so
      # `${{ github.action_path }}` resolves for every caller and nothing lands in the consumer's
      # workspace — which a second `actions/checkout` of this repository would not manage, since
      # its `src/*.jl` would then be inside the consumer's coverage sweep.
      #
      # Same split as `actions/upload-coverage`: the workflow owns what needs JOBS, an action owns
      # what has to run from this repository's own tree.
      - uses: QAtlasHub/TestShards.jl/actions/read-history@main

      # NON-FATAL, and this is the load-bearing one (issue #74). This job's real product is the
      # `matrix` OUTPUT, which is already set by the time this step runs — the log of a run that
      # failed here still reads `121 timing rows.` and `Set output 'matrix'`. Letting an upload
      # failure fail the JOB therefore discards a matrix that was computed successfully, and
      # every shard `needs:` it, so the entire suite is skipped.
      #
      # Measured: an organisation hit the Actions artifact storage quota and every consumer's CI
      # went red HERE — `Failed to CreateArtifact: Artifact storage quota has been hit` — before
      # a single test executed. A storage problem should cost the timing HISTORY, which is an
      # optimisation, not the TEST RESULT, which is the point of the run.
      - id: timings
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: ${{ inputs.artifact-prefix }}-timings
          path: timings.tsv
          retention-days: 1
          if-no-files-found: error

  # Precompile the package once, with the configuration the TEST step will use — that is the
  # part the depot cache cannot carry between runs, because the package under test changes with
  # every commit while its dependencies do not.
  prebuild:
    name: Precompile once
    if: ${{ inputs.prebuild }}
    outputs:
      # SAME SHAPE AS `labels.timings` (issue #74). The shared compiled cache is an OPTIMISATION —
      # a shard without it precompiles for itself and computes the same answer — so a storage
      # failure here must cost time, not the run. Decided once so the matrix cannot split.
      cache: ${{ steps.prebuilt.outcome }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: ${{ inputs.submodules }}
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ inputs.julia-version }}
      - uses: julia-actions/cache@v3
        if: ${{ inputs.cache }}
        with:
          cache-name: testshards
          include-matrix: 'false'
      # Same step as the one in `test` below, and it has to be: this job resolves the same
      # project, so a registry missing here fails the precompile instead of the tests. Kept as
      # two copies rather than a composite action because an action would be referenced by its
      # own ref, which is a second thing to keep current for eleven lines of script.
      - name: Ensure and refresh the registries this project resolves from
        if: ${{ inputs.registries != '' }}
        env:
          REGISTRIES: ${{ inputs.registries }}
        run: |
          set -euo pipefail
          julia --startup-file=no --project=/dev/null -e '
            using Pkg
            _norm(u) = replace(strip(String(u)), r"\.git$" => "")
            for spec in split(get(ENV, "REGISTRIES", ""), "\n")
                want = strip(spec)
                isempty(want) && continue
                have = Pkg.Registry.reachable_registries()
                if occursin("://", want) || occursin("@", want)
                    any(r -> _norm(r.repo) == _norm(want), have) && continue
                    Pkg.Registry.add(Pkg.RegistrySpec(; url = String(want)))
                else
                    any(r -> r.name == want, have) && continue
                    Pkg.Registry.add(String(want))
                end
            end
            println("registries: ",
                    join([r.name for r in Pkg.Registry.reachable_registries()], ", "))'
          # PRESENT is not the same as CURRENT, and a stale one fails differently: the resolve
          # succeeds and simply cannot see a version registered since the clone was last pulled.
          #
          # One `Pkg.Registry.update()` is NOT enough. It manages DEPOT_PATH[1] only, and a
          # self-hosted runner can carry the same registry twice — a per-runner front depot and a
          # shared ~/.julia. A runner whose FRONT depot lacks the registry resolves from the
          # shared clone, which the plain call never touches; the result is "some shards green,
          # one red on the same commit", and waiting after a registration does not help because
          # the staleness is per runner. It took three rounds of split results to find, because
          # nothing points at the depot layout until you print it.
          #
          # JULIA_DEPOT_PATH as a command PREFIX, never `setenv` from inside Julia — that
          # REPLACES the environment and takes HOME with it, losing git credentials for a private
          # registry.
          for d in $(julia --startup-file=no -e 'print(join(DEPOT_PATH, " "))'); do
            [ -d "$d/registries" ] || continue
            echo "--- refreshing registries in $d"
            JULIA_DEPOT_PATH="$d" julia --startup-file=no -e 'using Pkg; Pkg.Registry.update()' || true
          done

      # The flags are the point. `julia-buildpkg` precompiles with defaults; the test step runs
      # under --check-bounds=yes and --code-coverage, which is a DIFFERENT precompile
      # configuration with its own cache files. Building the default one and handing it over
      # would transfer the artefact the shards already had.
      - name: Precompile for the test configuration
        run: |
          set -euo pipefail
          julia --startup-file=no --project=. \
            --check-bounds=yes --code-coverage=@"$GITHUB_WORKSPACE" \
            -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
          tar -C "$HOME/.julia" -czf compiled.tgz compiled
          echo "Compiled cache: $(du -h compiled.tgz | cut -f1)"

      - id: prebuilt
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: ${{ inputs.artifact-prefix }}-prebuild
          path: compiled.tgz
          retention-days: 1
          if-no-files-found: error

  test:
    name: ${{ inputs.shards > 1 && format('shard {0}', matrix.sid) || 'the whole suite, unsplit' }}
    needs: [labels, prebuild]
    # `prebuild` is skipped when the input is off, and a skipped dependency would skip this too.
    if: ${{ !cancelled() && needs.labels.result == 'success' && needs.prebuild.result != 'failure' }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    strategy:
      fail-fast: false
      matrix:
        sid: ${{ fromJSON(needs.labels.outputs.matrix) }}
    steps:
      # Before everything, including the start stamp: the point is to look exactly like a shard
      # the scheduler handed over late, so the window has to start after the wait, not before.
      - name: Simulate a late arrival
        if: ${{ inputs.stagger-seconds != '0' }}
        run: |
          set -euo pipefail
          idx=${SID#s}
          secs=$(( (idx - 1) * STAGGER ))
          echo "Shard $SID waiting ${secs}s to simulate arriving ${secs}s into the run."
          sleep "$secs"
        env:
          SID: ${{ matrix.sid }}
          STAGGER: ${{ inputs.stagger-seconds }}

      # FIRST, before the checkout. Julia cannot see the checkout, the depot restore or the
      # precompilation that precede it, and those are most of what a shard pays — so a shard
      # window measured from inside the process would report a fixed cost several times too
      # small. Everything after this line is inside the window.
      - name: Mark when this shard's job started
        run: echo "TESTSHARDS_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          submodules: ${{ inputs.submodules }}

      # The ONE history `labels` read, not one this shard fetched for itself. A per-shard fetch
      # let a single transient failure put one shard on a different assignment function from the
      # rest — which double-runs some units and skips others, with every shard still green. See
      # the comment in `labels`; the reasoning lives there, next to the fetch.
      # GATED ON THE LABEL JOB'S ANSWER, not on this shard's luck (issue #74). Making the
      # download itself `continue-on-error` would reintroduce precisely the divergence the comment
      # above forbids: one shard with history and the rest without are on DIFFERENT assignment
      # functions, which double-runs some units and skips others with every shard still green.
      #
      # `needs.labels.outputs.timings` is one value for the whole matrix, so either every shard
      # has the history or none does. "None" is a state the package already defines — `load_timings`
      # returns an empty table for a missing path, which is what the first run of any suite gets —
      # so the fallback is the ordinary no-history assignment rather than a new code path.
      - uses: actions/download-artifact@v8
        if: ${{ needs.labels.outputs.timings == 'success' }}
        with:
          name: ${{ inputs.artifact-prefix }}-timings
          path: .testshards-timings

      - name: Report what this shard was given
        run: |
          if [ -f .testshards-timings/timings.tsv ]; then
            echo "$(wc -l < .testshards-timings/timings.tsv) timing rows, identical for every shard."
          else
            echo "::warning::no timing history this run (the label job could not publish it) — every shard is using the same unweighted assignment, which is correct but may balance worse."
          fi

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ inputs.julia-version }}
      - uses: julia-actions/cache@v3
        if: ${{ inputs.cache }}
        with:
          # ONE key for all shards. They instantiate the same project, so a per-shard key
          # would keep N separate depots and pay precompilation N times over — the dominant
          # part of the fixed cost that makes over-sharding expensive.
          cache-name: testshards
          # Must stay false: the default serialises the whole matrix context into the key,
          # which differs per shard and would silently undo the line above.
          include-matrix: 'false'
      # Before buildpkg, so that what it finds already precompiled it does not redo.
      - uses: actions/download-artifact@v8
        if: ${{ inputs.prebuild && needs.prebuild.outputs.cache == 'success' }}
        with:
          name: ${{ inputs.artifact-prefix }}-prebuild
      - name: Adopt the precompiled cache
        if: ${{ inputs.prebuild && needs.prebuild.outputs.cache == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.julia"
          tar -C "$HOME/.julia" -xzf compiled.tgz
          rm -f compiled.tgz
          echo "Adopted the shared compiled cache."

      - name: No shared compiled cache this run
        if: ${{ inputs.prebuild && needs.prebuild.outputs.cache != 'success' }}
        run: echo "::warning::the shared compiled cache could not be published, so this shard precompiles for itself — slower, same result."

      # The twin of the step in `prebuild` above — see the note there on why it is copied.
      - name: Ensure and refresh the registries this project resolves from
        if: ${{ inputs.registries != '' }}
        env:
          REGISTRIES: ${{ inputs.registries }}
        run: |
          set -euo pipefail
          julia --startup-file=no --project=/dev/null -e '
            using Pkg
            _norm(u) = replace(strip(String(u)), r"\.git$" => "")
            for spec in split(get(ENV, "REGISTRIES", ""), "\n")
                want = strip(spec)
                isempty(want) && continue
                have = Pkg.Registry.reachable_registries()
                if occursin("://", want) || occursin("@", want)
                    any(r -> _norm(r.repo) == _norm(want), have) && continue
                    Pkg.Registry.add(Pkg.RegistrySpec(; url = String(want)))
                else
                    any(r -> r.name == want, have) && continue
                    Pkg.Registry.add(String(want))
                end
            end
            println("registries: ",
                    join([r.name for r in Pkg.Registry.reachable_registries()], ", "))'
          # PRESENT is not the same as CURRENT, and a stale one fails differently: the resolve
          # succeeds and simply cannot see a version registered since the clone was last pulled.
          #
          # One `Pkg.Registry.update()` is NOT enough. It manages DEPOT_PATH[1] only, and a
          # self-hosted runner can carry the same registry twice — a per-runner front depot and a
          # shared ~/.julia. A runner whose FRONT depot lacks the registry resolves from the
          # shared clone, which the plain call never touches; the result is "some shards green,
          # one red on the same commit", and waiting after a registration does not help because
          # the staleness is per runner. It took three rounds of split results to find, because
          # nothing points at the depot layout until you print it.
          #
          # JULIA_DEPOT_PATH as a command PREFIX, never `setenv` from inside Julia — that
          # REPLACES the environment and takes HOME with it, losing git credentials for a private
          # registry.
          for d in $(julia --startup-file=no -e 'print(join(DEPOT_PATH, " "))'); do
            [ -d "$d/registries" ] || continue
            echo "--- refreshing registries in $d"
            JULIA_DEPOT_PATH="$d" julia --startup-file=no -e 'using Pkg; Pkg.Registry.update()' || true
          done

      - uses: julia-actions/julia-buildpkg@v1

      - name: ${{ inputs.shards > 1 && format('Run shard {0}', matrix.sid) || 'Run the whole suite' }}
        uses: julia-actions/julia-runtest@v1
        with:
          force_latest_compatible_version: ${{ inputs.force-latest-compatible-version }}
        env:
          # `shards: 1` asks for the suite WHOLE, so no id is handed over: with none set the
          # package runs every unit it observes. Setting `s1` instead would hit the package's
          # guard against a half-configured shard — a legal-looking input failing eight lines
          # deeper, in a message about environment variables the caller never wrote (#57).
          #
          # Written `cond && value || ''` and not `cond && '' || value`: an empty string is
          # FALSY in a GitHub expression, so the second form falls through to `value` and the
          # id is set anyway. The mistake is invisible in the file and visible only in a run.
          TESTSHARDS_ID: ${{ inputs.shards > 1 && matrix.sid || '' }}
          TESTSHARDS_N: ${{ inputs.shards }}
          TESTSHARDS_TIMINGS: ${{ github.workspace }}/.testshards-timings/timings.tsv
          # `Pkg.test` sandboxes the suite, so the output directory must be pinned into the
          # workspace or the upload would look where the files never were.
          TESTSHARDS_OUT: ${{ github.workspace }}/${{ inputs.test-root }}/.ci-out
          # Claiming, when asked for. The ref namespace is per RUN, so two runs of the same
          # commit cannot claim each other's work. GITHUB_TOKEN already has `contents: write`
          # from the caller — the same grant the timing history needs — so this adds no secret.
          TESTSHARDS_CLAIM: ${{ inputs.steal && '1' || '' }}
          TESTSHARDS_CLAIM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTSHARDS_CLAIM_REPO: ${{ github.repository }}
          TESTSHARDS_CLAIM_NS: tsclaim/${{ github.run_id }}/${{ github.run_attempt }}
          TESTSHARDS_CLAIM_SHA: ${{ github.sha }}
          TESTSHARDS_CLAIM_MIN: ${{ inputs.steal-min-seconds }}

      # The RAW counters, not a processed report. Converting them is identical work on every
      # shard — spin up a temp environment, resolve CoverageTools, convert this shard's files —
      # and `collect` merges the results anyway, so doing it here does it N times for one
      # answer. Measured on this repository it cost 3-25s per shard, the variance being a 20s
      # JuliaSyntax precompile that some runners accepted from the depot cache and others did
      # not. Doing it once makes the reason moot.
      #
      # `cp --parents` keeps each file's path, so the artifact has a fixed root whatever a
      # given shard happened to touch. Nothing here knows the naming convention: that lives in
      # `TestShards.restore_counters`, where a test can reach it.
      - name: Collect this shard's raw coverage counters
        if: ${{ inputs.coverage }}
        run: |
          set -euo pipefail
          mkdir -p .ts-cov
          n=0
          while IFS= read -r f; do
            rel=${f#./}
            mkdir -p ".ts-cov/$(dirname "$rel")"
            cp "$f" ".ts-cov/$rel"
            n=$((n + 1))
          done < <(find . -name '*.cov' -not -path './.ts-cov/*')
          echo "Captured $n coverage files."
          [ "$n" -gt 0 ] || echo "::warning::no .cov files — was the suite run with coverage on?"

      # NON-FATAL for the same reason (issue #74): this step runs AFTER the suite, so failing the
      # job here converts a green shard into a red one over a report. `collect` already treats
      # missing counters as a loud reporting failure of its own, which is where that belongs.
      - name: Upload this shard's coverage counters
        if: ${{ inputs.coverage }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-coverage-${{ matrix.sid }}
          path: .ts-cov
          retention-days: 1
          if-no-files-found: error
          # `.ts-cov` is hidden, and v4 drops hidden files unless told otherwise — it captured
          # 12 counters and uploaded none. The records upload below already knew this.
          include-hidden-files: true

      - name: Upload this shard's records and timings
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-out-${{ matrix.sid }}
          path: ${{ inputs.test-root }}/.ci-out/*
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

      # A SECOND ROAD FOR THE SAME EVIDENCE, and only for the evidence (#74).
      #
      # `Every unit ran, exactly once` is a CORRECTNESS claim — this file's own comment says only
      # such a claim may fail a suite — and it is the one thing here that cannot simply be skipped
      # when its input is missing. A full artifact storage quota takes the artifact road out and
      # the gate with it, which is how a fleet of green suites went red for six days.
      #
      # Cache is the transport that clears every constraint this workflow has: no permission the
      # callers do not already grant (a reusable workflow may not request more than its caller
      # gave, and asking makes every consumer fail to START), no new action in this repo (a new
      # action and its first reference cannot land together — #84), and a quota of its own.
      # Measured: ~373 B per file, three files, ~1.1 kB a shard.
      #
      # THE KEY MUST NAME THE CALLER, not just the run. This workflow is reusable and a single run
      # can invoke it more than once — this repo's own CI does, `ci` with 8 shards and `solo` with
      # 1 — so a key of `run_id + sid` alone makes the second caller's collector restore the FIRST
      # caller's shard. Measured: `solo`'s gate reported "3 unit(s) ran twice: 1 on local and s1",
      # because its own evidence is labelled `local` while what it picked up was `ci`'s `s1`.
      # `artifact-prefix` is the discriminator this workflow already uses for exactly this.
      #
      # THE PATH MUST MATCH THE RESTORE'S EXACTLY. A cache entry is identified by its key AND by a
      # version derived from the `path` inputs, so saving one path and restoring into another is a
      # miss on an identical key — "Cache saved with key: X" and "Cache not found for input keys: X"
      # in the same run. The collector restores to this same path and moves the files afterwards.
      - name: Cache this shard's evidence — the road that survives a full artifact quota
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ inputs.test-root }}/.ci-out
          key: testshards-evidence-${{ inputs.artifact-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.sid }}

  collect:
    name: Collect coverage and records
    needs: test
    if: ${{ always() && needs.test.result != 'cancelled' }}
    runs-on: ${{ fromJSON(inputs.helper-runner) }}
    steps:
      # FIRST, and not optional. Codecov builds the report's file "network" from the checked
      # out tree; a report uploaded without one is rejected during server-side PROCESSING,
      # which is invisible from the run — the upload succeeds as soon as it is queued. This
      # job never had a checkout, and every sharded run failed to process from the day the
      # coverage upload moved into it, while the unsharded job that had one was fine.
      #
      # It must come before the download: `actions/checkout` cleans the workspace by default
      # and would delete the artifacts.
      - uses: actions/checkout@v7
        with:
          submodules: ${{ inputs.submodules }}

      - uses: actions/download-artifact@v8
        with:
          path: parts
          pattern: ${{ inputs.artifact-prefix }}-*

      # Both reporting steps below are TestShards calling itself, so install it once. Doing the
      # work in the package rather than in this file is the point: a merge written as a step
      # script is unreachable from `Pkg.test()`, and the one that used to live here reported
      # 54.5% for a suite that covered 94.8% for as long as it existed.
      - uses: julia-actions/setup-julia@v3
        if: ${{ inputs.coverage || inputs.diagnose }}
        with:
          version: ${{ inputs.julia-version }}
      - name: Install TestShards for the reporting steps
        if: ${{ inputs.coverage || inputs.diagnose }}
        env:
          SPEC: ${{ inputs.testshards-spec }}
        run: |
          set -euo pipefail
          julia --startup-file=no --project=/dev/null -e '
            using Pkg
            Pkg.activate(joinpath(ENV["RUNNER_TEMP"], "tsenv"))
            Pkg.add(; eval(Meta.parse("(" * ENV["SPEC"] * ",)"))...)
            using TestShards' # precompile HERE, not in the middle of writing a report

      # ONCE, here, rather than N times in the shards. The counters arrive flattened and
      # shard-suffixed; putting them back where their sources are is what lets CoverageTools
      # find them, and it globs `<file>.*.cov` so the suffix is free.
      # ONCE, here, rather than N times in the shards.
      # NON-FATAL, but LOUD (issue #74). Coverage is a REPORT; "every unit ran exactly once",
      # below, is a CORRECTNESS CLAIM, and only the second one should be able to fail a suite.
      # Those are this file's own two categories and they were sharing one exit status: when the
      # per-shard uploads were refused by a full artifact storage quota, this step found no
      # counters, `collect` failed, and the `All shards passed` gate — which needs `collect` —
      # reported a red suite for a run whose tests were all green.
      #
      # The refusal inside `restore_counters` stays exactly as loud as it was; what changes is
      # that it annotates instead of gating. The silent-coverage-loss failure this guards
      # (54.5 % reported for a 94.8 % suite) is still impossible: a missing report is an
      # `::error::` in the run and an absent Codecov upload, not a quietly wrong number.
      - name: Convert every shard's counters into one report
        if: ${{ inputs.coverage }}
        continue-on-error: true
        run: |
          set -euo pipefail
          julia --startup-file=no --project="$RUNNER_TEMP/tsenv" -e '
            using TestShards
            files = TestShards.restore_counters("parts", ".")
            isempty(files) && error("no coverage counters — did every shard die before uploading?")
            println("Restored ", length(files), " counter files from the shards.")'
          julia --startup-file=no --project=/dev/null -e '
            using Pkg
            Pkg.activate(joinpath(ENV["RUNNER_TEMP"], "covenv"))
            Pkg.add("CoverageTools")
            using CoverageTools
            fc = mapreduce(process_folder, merge_coverage_counts,
                           filter(isdir, ["src", "ext"]); init=FileCoverage[])
            LCOV.writefile("lcov.info", fc)
            covered, total = get_summary(fc)
            pct = total > 0 ? round(100 * covered / total; digits=1) : 0.0
            open(ENV["GITHUB_STEP_SUMMARY"], "a") do io
                println(io, "### Coverage\n")
                println(io, "| | |\n|---|--:|")
                println(io, "| coverage | ", pct, "% (", covered, "/", total, " lines) |")
                println(io, "| source files | ", length(fc), " |")
            end
            println("Coverage ", pct, "% (", covered, "/", total, " lines) over ", length(fc), " files.")'

      # An empty token is a CERTAIN failure, not a flaky one: Codecov rejects a tokenless upload
      # during server-side processing, after the uploader has already succeeded at queueing it.
      # So it is not attempted — the attempt would only add a red `failed:` line under a green
      # check and send nothing.
      #
      # Recorded as one plain line rather than a `::warning::`. A repository that has decided not
      # to hold a Codecov token does not need an annotation about it on every run, and an
      # annotation nobody acts on is how annotations stop being read. Nothing is lost but the
      # sending: the percentage is already in this job's `Coverage` step summary, and the report
      # itself is published as the `testshards-lcov` artifact.
      #
      # The emptiness is tested in the shell, not in `if:`. The `secrets` context is not
      # available to a step-level condition — it would evaluate to the empty string whatever the
      # secret holds, and this would skip the upload on every run that has a perfectly good
      # token, which is the failure direction that resembles success.
      - name: Is there a token?
        id: token
        if: ${{ inputs.coverage && inputs.coverage-upload }}
        env:
          TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "No CODECOV_TOKEN reached this workflow, so the report is not being sent. It is merged and published as the 'testshards-lcov' artifact either way, and the percentage is in the Coverage summary above."
            echo "A PRIVATE repository cannot pass a secret into a reusable workflow — measured against two PUBLIC callers, one of them in another organisation, which both receive it. Upload from your own repository with QAtlasHub/TestShards.jl/actions/upload-coverage and pass coverage-upload: false here. (A private repo also needs a CODECOV_TOKEN of its own: an organisation secret does not reach one on a free plan.)"
            echo "Coverage merged but **not uploaded** — no Codecov token. The percentage is in the \`Coverage\` summary above; the report itself is the \`testshards-lcov\` artifact." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: codecov/codecov-action@v7
        if: ${{ inputs.coverage && inputs.coverage-upload && steps.token.outputs.have == 'true' }}
        continue-on-error: true          # a flaky upload must not redden a green suite
        with:
          files: lcov.info
          # Without this the CLI ALSO auto-discovers every shard's lcov.info still sitting in
          # parts/, so the one merged report becomes N+1 uploads of the same coverage — the
          # opposite of what this job exists to do.
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Published whether or not the upload above worked, and it is what makes the failure
      # recoverable rather than merely visible: the merge is the expensive, easy-to-get-wrong
      # part, and it has already happened by here. A caller whose token does not reach this
      # workflow can hand this artifact to `actions/upload-coverage` in a job of its own and
      # lose nothing.
      - name: Publish the merged report
        if: ${{ inputs.coverage }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-lcov
          path: lcov.info
          retention-days: 7
          if-no-files-found: error

      # NOT best-effort, and not conditional on `steal`. Under assignment this is a theorem —
      # every shard computes the same total function, so a unit nobody runs cannot exist — and
      # checking a theorem each run costs nothing while turning it from an argument into
      # evidence. Under claiming it is the only thing standing between a runner dying mid-claim
      # and a green run that quietly skipped part of the suite.
      # THE SECOND ROAD, restored here. It feeds ONLY the completeness gate below: the records
      # merge keeps reading `parts` alone, because two roads delivering the same `records-*.jsonl`
      # would double every record, while the gate's three lists are `sort -u`'d and therefore
      # idempotent under duplication.
      #
      # A LADDER rather than a loop, because `uses:` cannot be looped and the shard count is an
      # input. Sixteen covers twice the default; a run with more shards keeps the artifact road,
      # which is the behaviour it has today.
      - uses: actions/cache/restore@v6
        id: ev1
        if: ${{ inputs.shards >= 1 }}
        continue-on-error: true
        with:
          path: ${{ inputs.test-root }}/.ci-out
          key: testshards-evidence-${{ inputs.artifact-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}-s1
          fail-on-cache-miss: false
      - name: stash s1
        if: ${{ inputs.shards >= 1 }}
        continue-on-error: true
        run: |
          d="${{ inputs.test-root }}/.ci-out"
          mkdir -p cache-parts/s1
          [ -d "$d" ] && { mv "$d"/* cache-parts/s1/ 2>/dev/null || true; rm -rf "$d"; }
          echo "s1: hit='${{ steps.ev1.outputs.cache-hit }}' files=$(ls cache-parts/s1 2>/dev/null | wc -l)"
      - uses: actions/cache/restore@v6
        id: ev2
        if: ${{ inputs.shards >= 2 }}
        continue-on-error: true
        with:
          path: ${{ inputs.test-root }}/.ci-out
          key: testshards-evidence-${{ inputs.artifact-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}-s2
          fail-on-cache-miss: false
      - name: stash s2
        if: ${{ inputs.shards >= 2 }}
        continue-on-error: true
        run: |
          d="${{ inputs.test-root }}/.ci-out"
          mkdir -p cache-parts/s2
          [ -d "$d" ] && { mv "$d"/* cache-parts/s2/ 2>/dev/null || true; rm -rf "$d"; }
          echo "s2: hit='${{ steps.ev2.outputs.cache-hit }}' files=$(ls cache-parts/s2 2>/dev/null | wc -l)"
      - uses: actions/cache/restore@v6
        id: ev3
        if: ${{ inputs.shards >= 3 }}
        continue-on-error: true
        with:
          path: ${{ inputs.test-root }}/.ci-out
          key: testshards-evidence-${{ inputs.artifact-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}-s3
          fail-on-cache-miss: false
      - name: stash s3
        if: ${{ inputs.shards >= 3 }}
        continue-on-error: true
        run: |
          d="${{ inputs.test-root }}/.ci-out"
          mkdir -p cache-parts/s3
          [ -d "$d" ] && { mv "$d"/* cache-parts/s3/ 2>/dev/null || true; rm -rf "$d"; }
          echo "s3: hit='${{ steps.ev3.outputs.cache-hit }}' files=$(ls cache-parts/s3 2>/dev/null | wc -l)"
      - uses: actions/cache/restore@v6
        id: ev4
        if: ${{ inputs.shards >= 4 }}
        continue-on-error: true
        with:
          path: ${{ inputs.test-root }}/.ci-out
          key: testshards-evidence-${{ inputs.artifact-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}-s4
          fail-on-cache-miss: false
      - name: stash s4
        if: ${{ inputs.shards >= 4 }}
        continue-on-error: true
        run: |
          d="${{ inputs.test-root }}/.ci-out"
          mkdir -p cache-parts/s4
          [ -d "$d" ] && { mv "$d"/* cache-parts/s4/ 2>/dev/null || true; rm -rf "$d"; }
          echo "s4: hit='${{ steps.ev4.outputs.cache-hit }}' files=$(ls cache-parts/s4 2>/dev/null | wc -l)"
      - uses: actions/cache/restore@v6
        id: ev5
