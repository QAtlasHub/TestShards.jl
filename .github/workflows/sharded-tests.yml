name: Sharded tests

# Reusable: the WHOLE sharded-test vertical, so a consumer repository carries none of it.
#
# A repo that adopts this has NO `test/ci/` scripts, NO hand-written test universe, and no
# per-repo coverage-merge or timing-recording job. It has two things:
#
#   test/runtests.jl        using MyPackage, TestShards
#                           TestShards.@runtests oneshots = ["test_aqua.jl"]
#
#   .github/workflows/CI.yml
#                           jobs:
#                             test:
#                               uses: QAtlasHub/TestShards.jl/.github/workflows/sharded-tests.yml@main
#                               with: { shards: 8, runner: '["self-hosted","rosina"]' }
#                               secrets: inherit
#
# What runs here:
#   plan      install TestShards in a TEMP env and ask it for the matrix — the planner never
#             loads the package under test, so planning cannot pay its precompile cost.
#   test      one job per shard; each emits its own lcov and its own timing rows.
#   coverage  merge every shard's lcov and upload ONCE. This is the part that is otherwise
#             hand-written in every repo, and the reason per-shard uploads are not used: one
#             merged report is one coverage number, not N partial ones racing in Codecov.
#   timings   on push to the default branch only, merge the shards' timings into the
#             `ci-timings` orphan branch. A PR must never rewrite the history it was planned
#             against, or two PRs racing would each plan against the other's numbers.
#   gate      one required-check-shaped job that is green iff every shard was.
#
# Without a timing history the planner emits deterministic round-robin, so the first run of a
# fresh repo is correct but unbalanced; it balances itself from the second push onward.

on:
  workflow_call:
    inputs:
      shards:
        description: 'Number of shards to request. The planner emits min(shards, #files).'
        type: number
        default: 8
      runner:
        description: 'runs-on as JSON: ''"ubuntu-latest"'' or ''["self-hosted","rosina"]'''
        type: string
        default: '"ubuntu-latest"'
      plan-runner:
        description: 'Runner for the tiny plan/merge jobs. Keep hosted: they need no depot.'
        type: string
        default: '"ubuntu-latest"'
      julia-version:
        type: string
        default: '1'
      test-root:
        description: 'Directory holding the test suite.'
        type: string
        default: 'test'
      coverage:
        description: 'Merge the shards'' coverage and upload it to Codecov.'
        type: boolean
        default: true
      testshards-spec:
        description: 'How the plan job installs TestShards (a Pkg.add argument list).'
        type: string
        default: 'url="https://github.com/QAtlasHub/TestShards.jl"'
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan shards
    runs-on: ${{ fromJSON(inputs.plan-runner) }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the timing history (best-effort)
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin ci-timings >/dev/null 2>&1; then
            git fetch --depth=1 origin ci-timings
            git show FETCH_HEAD:timings.tsv > timings.tsv 2>/dev/null \
              && echo "Loaded $(wc -l < timings.tsv) timing rows." \
              || { echo "ci-timings exists but has no timings.tsv — round-robin."; : > timings.tsv; }
          else
            echo "No ci-timings branch yet — round-robin until the first push to the default branch."
            : > timings.tsv
          fi

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ inputs.julia-version }}

      - id: plan
        name: Ask TestShards for the matrix
        env:
          SPEC: ${{ inputs.testshards-spec }}
          ROOT: ${{ inputs.test-root }}
          N: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          # A TEMP environment on purpose: the planner must not resolve, precompile, or even
          # look at the package under test. It only walks the test directory.
          matrix=$(julia --startup-file=no --project=/dev/null -e '
            using Pkg
            Pkg.activate(; temp=true)
            Pkg.add(; eval(Meta.parse("(" * ENV["SPEC"] * ",)"))...)
            using TestShards
            exit(TestShards.main([ENV["N"], "timings.tsv"]; root=ENV["ROOT"]))')
          if [ -z "$matrix" ] || [ "$matrix" = "[]" ]; then
            echo "::error::TestShards produced an empty plan"; exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test:
    name: shard ${{ matrix.sid }}
    needs: plan
    runs-on: ${{ fromJSON(inputs.runner) }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ inputs.julia-version }}
      - uses: julia-actions/cache@v2
        with:
          cache-name: testshards-${{ matrix.sid }}
          # The default serialises the whole matrix context into the key, which differs per
          # shard for the file list — every shard would then miss the cache and recompile.
          include-matrix: 'false'
      - uses: julia-actions/julia-buildpkg@v1

      - name: Run shard ${{ matrix.sid }}
        uses: julia-actions/julia-runtest@v1
        env:
          TESTSHARDS_FILES: ${{ matrix.files }}
          TESTSHARDS_ONESHOTS: ${{ matrix.oneshots }}
          TESTSHARDS_ID: ${{ matrix.sid }}
          # Record only from the default branch (see the header). `Pkg.test` sandboxes the
          # suite, so the output directory must be pinned into the workspace or the artifact
          # upload would look somewhere the emitted file never was.
          TESTSHARDS_EMIT: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && '1' || '0' }}
          TESTSHARDS_OUT: ${{ github.workspace }}/${{ inputs.test-root }}/.ci-out

      - uses: julia-actions/julia-processcoverage@v1
        if: ${{ inputs.coverage }}

      - name: Upload this shard's coverage
        if: ${{ inputs.coverage }}
        uses: actions/upload-artifact@v4
        with:
          name: testshards-coverage-${{ matrix.sid }}
          path: lcov.info
          retention-days: 1
          if-no-files-found: error

      - name: Upload this shard's timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testshards-timing-${{ matrix.sid }}
          path: ${{ inputs.test-root }}/.ci-out/timings-*.tsv
          retention-days: 1
          if-no-files-found: ignore
          include-hidden-files: true

  coverage:
    name: Coverage (merged)
    needs: test
    if: ${{ always() && inputs.coverage && needs.test.result != 'cancelled' }}
    runs-on: ${{ fromJSON(inputs.plan-runner) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: coverage-parts
          pattern: testshards-coverage-*
      - name: Merge every shard's lcov into one report
        run: |
          set -euo pipefail
          mapfile -t files < <(find coverage-parts -name 'lcov.info' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no coverage artifacts — did every shard fail before processcoverage?"
            exit 1
          fi
          echo "Merging ${#files[@]} shard reports."
          if command -v lcov >/dev/null 2>&1; then
            args=(); for f in "${files[@]}"; do args+=(-a "$f"); done
            lcov "${args[@]}" -o lcov.info
          else
            # Concatenation IS a valid lcov report: repeated SF: records for the same file are
            # summed by every consumer we target, Codecov included.
            cat "${files[@]}" > lcov.info
          fi
      - uses: codecov/codecov-action@v4
        continue-on-error: true          # a flaky upload must not redden a green suite
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  timings:
    name: Record timing history
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.test.result == 'success' }}
    runs-on: ${{ fromJSON(inputs.plan-runner) }}
    permissions:
      contents: write                   # force-pushes the ci-timings orphan branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: timing-parts
          pattern: testshards-timing-*
      - name: Merge into the ci-timings orphan branch (latest value wins)
        run: |
          set -euo pipefail
          mkdir -p merged
          if git ls-remote --exit-code --heads origin ci-timings >/dev/null 2>&1; then
            git fetch --depth=1 origin ci-timings
            git show FETCH_HEAD:timings.tsv > merged/timings.tsv 2>/dev/null || : > merged/timings.tsv
          else
            : > merged/timings.tsv
          fi
          find timing-parts -name 'timings-*.tsv' -exec cat {} + >> merged/timings.tsv || true
          awk -F'\t' 'NF==2{t[$1]=$2} END{for (k in t) print k"\t"t[k]}' \
            merged/timings.tsv | sort > merged/final.tsv
          rows=$(wc -l < merged/final.tsv)
          if [ "$rows" -lt 1 ]; then
            echo "::error::0 timing rows from a green run — the emit path is broken (TESTSHARDS_EMIT / TESTSHARDS_OUT), and planning would silently round-robin forever."
            exit 1
          fi
          echo "Merged $rows timing rows."
          tmp=$(mktemp -d); cp merged/final.tsv "$tmp/timings.tsv"; cd "$tmp"
          git init -q
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git checkout -q -b ci-timings
          git add timings.tsv
          git commit -q -m "ci: refresh test timings ($rows rows) [skip ci]"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-timings

  gate:
    name: All shards passed
    needs: [plan, test]
    if: always()
    runs-on: ${{ fromJSON(inputs.plan-runner) }}
    steps:
      - name: Check the plan and every shard
        run: |
          if [ "${{ needs.plan.result }}" != "success" ]; then
            echo "::error::shard planning failed (${{ needs.plan.result }})"; exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::one or more shards failed (${{ needs.test.result }})"; exit 1
          fi
          echo "All shards green."
