name: Sharded tests

# Reusable: the whole sharded-test vertical, so a consumer repository carries none of it.
#
# A repo that adopts this has no shard-planning script, no test-file manifest, no
# coverage-merge job and no timing-recording job. It has two things:
#
#   test/runtests.jl        using MyPackage, TestShards
#                           TestShards.@shard begin
#                               include("core/a.jl")
#                               ...
#                           end
#
#   .github/workflows/CI.yml
#                           jobs:
#                             test:
#                               uses: QAtlasHub/TestShards.jl/.github/workflows/sharded-tests.yml@main
#                               with: { shards: 8, runner: '["self-hosted","rosina"]' }
#                               secrets: inherit
#
# THERE IS NO PLANNING JOB. Each shard decides what it owns from the same timing history,
# using the same deterministic assignment, so the matrix carries labels only — no Julia runs
# before the tests, and nothing has to know what the suite contains in order to split it.
#
#   test      one job per shard; each writes its own records (JSONL) and timings (TSV).
#   collect   merge every shard's coverage into ONE Codecov upload, and every shard's records
#             into one ordered document. This is the part otherwise hand-written per repo.
#   timings   on the default branch only, fold the timings into the `ci-timings` orphan branch.
#             A PR must never rewrite the history it was planned against.
#   gate      one required-check-shaped job, green iff every shard was.
#
# With no history the shards fall back to round-robin, so a fresh repo is correct from the
# first run and balances itself from the second push onward.

on:
  workflow_call:
    inputs:
      shards:
        description: 'Number of shards.'
        type: number
        default: 8
      runner:
        description: 'runs-on as JSON: ''"ubuntu-latest"'' or ''["self-hosted","rosina"]'''
        type: string
        default: '"ubuntu-latest"'
      helper-runner:
        description: 'Runner for the small merge jobs. Keep hosted: they need no depot.'
        type: string
        default: '"ubuntu-latest"'
      julia-version:
        type: string
        default: '1'
      test-root:
        description: 'Directory holding runtests.jl, relative to the repository.'
        type: string
        default: 'test'
      coverage:
        type: boolean
        default: true
      diagnose:
        description: 'Report what the timing history says about the shape of the suite.'
        type: boolean
        default: true
      fixed-cost-seconds:
        description: >
          Per-shard cost that does not shrink with more shards (checkout, depot restore,
          precompile). Leave at 0: the shards now report their own windows and the diagnosis
          MEASURES it. Set it only to ask what a hypothetical price would do to the curve.
          Only scales the reported cost; the knee is the same either way.
        type: string
        default: '0'
      testshards-spec:
        description: 'How the diagnosis step installs TestShards (a Pkg.add argument list).'
        type: string
        default: 'url="https://github.com/QAtlasHub/TestShards.jl"'
    secrets:
      CODECOV_TOKEN:
        required: false

# NO top-level `permissions:` here. In a called workflow each job requests what it needs and
# the CALLER's grant is the ceiling; a job asking for more than the caller granted makes the
# whole run fail to START (startup_failure), with no log to read. The caller must therefore
# grant `contents: write`, which `timings` needs to push the ci-timings orphan branch.

jobs:
  # The only thing computed before the tests is the LABELS s1..sN, because GitHub expressions
  # cannot build a range. No Julia and no checkout: which units a shard owns is decided inside
  # the shard, from the timing history.
  labels:
    name: Shard labels
    runs-on: ${{ fromJSON(inputs.helper-runner) }}
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        run: |
          set -euo pipefail
          n=${{ inputs.shards }}
          [ "$n" -ge 1 ] || { echo "::error::shards must be >= 1 (got $n)"; exit 1; }
          m=$(seq 1 "$n" | sed 's/^/"s/; s/$/"/' | paste -sd, -)
          echo "matrix=[$m]" >> "$GITHUB_OUTPUT"
          echo "Shards: [$m]"

  test:
    name: shard ${{ matrix.sid }}
    needs: labels
    runs-on: ${{ fromJSON(inputs.runner) }}
    strategy:
      fail-fast: false
      matrix:
        sid: ${{ fromJSON(needs.labels.outputs.matrix) }}
    steps:
      # FIRST, before the checkout. Julia cannot see the checkout, the depot restore or the
      # precompilation that precede it, and those are most of what a shard pays — so a shard
      # window measured from inside the process would report a fixed cost several times too
      # small. Everything after this line is inside the window.
      - name: Mark when this shard's job started
        run: echo "TESTSHARDS_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Fetch the timing history (best-effort)
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin ci-timings >/dev/null 2>&1; then
            git fetch --depth=1 origin ci-timings
            git show FETCH_HEAD:timings.tsv > "${{ inputs.test-root }}/.timings.tsv" 2>/dev/null \
              && echo "Loaded $(wc -l < "${{ inputs.test-root }}/.timings.tsv") timing rows." \
              || { echo "ci-timings has no timings.tsv — round-robin."; : > "${{ inputs.test-root }}/.timings.tsv"; }
          else
            echo "No ci-timings branch yet — round-robin until the first push to the default branch."
            : > "${{ inputs.test-root }}/.timings.tsv"
          fi

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ inputs.julia-version }}
      - uses: julia-actions/cache@v3
        with:
          # ONE key for all shards. They instantiate the same project, so a per-shard key
          # would keep N separate depots and pay precompilation N times over — the dominant
          # part of the fixed cost that makes over-sharding expensive.
          cache-name: testshards
          # Must stay false: the default serialises the whole matrix context into the key,
          # which differs per shard and would silently undo the line above.
          include-matrix: 'false'
      - uses: julia-actions/julia-buildpkg@v1

      - name: Run shard ${{ matrix.sid }}
        uses: julia-actions/julia-runtest@v1
        env:
          TESTSHARDS_ID: ${{ matrix.sid }}
          TESTSHARDS_N: ${{ inputs.shards }}
          TESTSHARDS_TIMINGS: ${{ github.workspace }}/${{ inputs.test-root }}/.timings.tsv
          # `Pkg.test` sandboxes the suite, so the output directory must be pinned into the
          # workspace or the upload would look where the files never were.
          TESTSHARDS_OUT: ${{ github.workspace }}/${{ inputs.test-root }}/.ci-out

      - uses: julia-actions/julia-processcoverage@v1
        if: ${{ inputs.coverage }}
      - name: Upload this shard's coverage
        if: ${{ inputs.coverage }}
        uses: actions/upload-artifact@v4
        with:
          name: testshards-coverage-${{ matrix.sid }}
          path: lcov.info
          retention-days: 1
          if-no-files-found: error

      - name: Upload this shard's records and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testshards-out-${{ matrix.sid }}
          path: ${{ inputs.test-root }}/.ci-out/*
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

  collect:
    name: Collect coverage and records
    needs: test
    if: ${{ always() && needs.test.result != 'cancelled' }}
    runs-on: ${{ fromJSON(inputs.helper-runner) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: parts
          pattern: testshards-*

      - name: Merge every shard's coverage into one report
        if: ${{ inputs.coverage }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find parts -name 'lcov.info' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no coverage artifacts — did every shard die before processcoverage?"
            exit 1
          fi
          echo "Merging ${#files[@]} shard reports."
          # A real merge, not a concatenation. Every shard loads the whole package, so all N
          # reports list the SAME source files and differ only in which lines ran; the union
          # is what the suite covered. Concatenating instead leaves N `SF:` records for one
          # file — which this workflow used to do, on the stated assumption that consumers sum
          # them. Codecov does not: every sharded run from 2026-07-27 failed to process, while
          # the unsharded runs before it were fine. `lcov` is not on the hosted image, so the
          # fallback WAS the code path, and the assumption was never exercised anywhere else.
          python3 - lcov.info "${files[@]}" <<'MERGE'
          import collections, sys

          out, srcs = sys.argv[1], sys.argv[2:]
          da = collections.defaultdict(collections.Counter)        # file -> line -> hits
          fn = collections.defaultdict(dict)                       # file -> name -> line
          fnda = collections.defaultdict(collections.Counter)      # file -> name -> hits
          br = collections.defaultdict(dict)                       # file -> (l,b,i) -> taken
          order, seen = [], set()

          for path in srcs:
              cur = None
              for raw in open(path, errors="replace"):
                  ln = raw.strip()
                  if ln.startswith("SF:"):
                      cur = ln[3:]
                      if cur not in seen:
                          seen.add(cur)
                          order.append(cur)
                  elif cur is None or ln == "end_of_record":
                      cur = None
                  elif ln.startswith("DA:"):
                      n, _, c = ln[3:].partition(",")
                      da[cur][int(n)] += int(float(c))
                  elif ln.startswith("FN:"):
                      n, _, name = ln[3:].partition(",")
                      fn[cur][name] = int(n)
                  elif ln.startswith("FNDA:"):
                      c, _, name = ln[5:].partition(",")
                      fnda[cur][name] += int(float(c))
                  elif ln.startswith("BRDA:"):
                      p = ln[5:].split(",")
                      if len(p) == 4:
                          key, taken = tuple(p[:3]), p[3]
                          prev = br[cur].get(key)
                          # "-" means the branch was never reached in THAT report; a number
                          # from any other shard supersedes it.
                          if taken != "-":
                              br[cur][key] = (0 if prev in (None, "-") else prev) + int(taken)
                          elif prev is None:
                              br[cur][key] = "-"

          with open(out, "w") as f:
              for sf in order:
                  f.write("SF:%s\n" % sf)
                  for name, line in sorted(fn[sf].items(), key=lambda kv: (kv[1], kv[0])):
                      f.write("FN:%d,%s\n" % (line, name))
                  for name, c in sorted(fnda[sf].items()):
                      f.write("FNDA:%d,%s\n" % (c, name))
                  if fn[sf]:
                      f.write("FNF:%d\n" % len(fn[sf]))
                      f.write("FNH:%d\n" % sum(1 for c in fnda[sf].values() if c > 0))
                  for key, taken in sorted(br[sf].items(), key=lambda kv: int(kv[0][0])):
                      f.write("BRDA:%s,%s,%s,%s\n" % (key + (taken,)))
                  if br[sf]:
                      f.write("BRF:%d\n" % len(br[sf]))
                      f.write(
                          "BRH:%d\n" % sum(1 for t in br[sf].values() if t != "-" and t > 0)
                      )
                  hits = sorted(da[sf].items())
                  for n, c in hits:
                      f.write("DA:%d,%d\n" % (n, c))
                  f.write("LF:%d\n" % len(hits))
                  f.write("LH:%d\n" % sum(1 for _, c in hits if c > 0))
                  f.write("end_of_record\n")
          print("Merged %d files, %d source files." % (len(srcs), len(order)))
          MERGE
          # Report the number here too. The upload below cannot be trusted to say anything:
          # it reports success as soon as the payload is QUEUED, and a report that fails
          # server-side processing afterwards looks identical to one that worked.
          awk -F: '/^LF:/ {f+=$2} /^LH:/ {h+=$2} END {
                     if (f > 0) printf "| coverage | %.1f%% (%d/%d lines) |\n", 100*h/f, h, f;
                     else print "| coverage | no line data |" }' lcov.info > cov.md
          { echo "### Coverage"; echo; echo "| | |"; echo "|---|--:|"; cat cov.md; } \
            >> "$GITHUB_STEP_SUMMARY"

      - uses: codecov/codecov-action@v7
        if: ${{ inputs.coverage }}
        continue-on-error: true          # a flaky upload must not redden a green suite
        with:
          files: lcov.info
          # Without this the CLI ALSO auto-discovers every shard's lcov.info still sitting in
          # parts/, so the one merged report becomes N+1 uploads of the same coverage — the
          # opposite of what this job exists to do.
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Merge every shard's records into one ordered document
        run: |
          set -euo pipefail
          # Every record carries `index`, its position in the FULL observed sequence and
          # identical in every shard, so ordering on it reassembles source order across jobs.
          find parts -name 'records-*.jsonl' -exec cat {} + > raw.jsonl || : > raw.jsonl
          # Inlined rather than kept as a script file: this is a REUSABLE workflow, so a
          # checkout here would fetch the CALLER's repository, which has no script of ours.
          python3 - raw.jsonl records.jsonl <<'MERGE' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib, sys
          src, dst = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          rs = [json.loads(l) for l in src.read_text().splitlines() if l.strip()]
          rs.sort(key=lambda r: r["index"])
          dst.write_text("".join(json.dumps(r) + "\n" for r in rs))
          print("### Units\n")
          print("| unit | shard | seconds | pass | fail | error |")
          print("|---|---|--:|--:|--:|--:|")
          for r in rs:
              print(f"| `{r['key']}` | {r['shard'] or 'all'} | {r['duration']:.2f} | "
                    f"{r['npass']} | {r['nfail']} | {r['nerror']} |")
          MERGE
          echo "Merged $(wc -l < records.jsonl) unit records."

      - name: Upload the merged records
        uses: actions/upload-artifact@v4
        with:
          name: testshards-records
          path: records.jsonl
          retention-days: 30
          if-no-files-found: warn

      # What the numbers mean, rather than what they are: how many shards this suite can
      # actually use, what is stopping it using more, and which section of the heaviest unit
      # to cut. Best-effort — a diagnosis must never be the thing that fails a run.
      - uses: julia-actions/setup-julia@v3
        if: ${{ inputs.diagnose }}
        continue-on-error: true
        with:
          version: ${{ inputs.julia-version }}
      - name: Diagnose the shape of the suite
        if: ${{ inputs.diagnose }}
        continue-on-error: true
        env:
          SPEC: ${{ inputs.testshards-spec }}
          SHARDS: ${{ inputs.shards }}
          FIXED: ${{ inputs.fixed-cost-seconds }}
        run: |
          set -euo pipefail
          find parts -name 'timings-*.tsv'  -exec cat {} + | sort -u > all-timings.tsv  || : > all-timings.tsv
          find parts -name 'sections-*.tsv' -exec cat {} + | sort -u > all-sections.tsv || : > all-sections.tsv
          # One row per shard: when it ran, not how long its units took. This is what turns
          # "the split should give 3.2x" into what the run actually delivered.
          find parts -name 'shard-*.tsv'    -exec cat {} + | sort -u > all-shards.tsv   || : > all-shards.tsv
          [ -s all-timings.tsv ] || { echo "No timings yet — nothing to diagnose."; exit 0; }
          julia --startup-file=no --project=/dev/null -e '
            using Pkg
            Pkg.activate(; temp=true)
            Pkg.add(; eval(Meta.parse("(" * ENV["SPEC"] * ",)"))...)
            using TestShards
            exit(TestShards.diagnose_cli([
                "all-timings.tsv", "all-sections.tsv", "all-shards.tsv",
                "--shards", ENV["SHARDS"], "--fixed", ENV["FIXED"],
            ]))' >> "$GITHUB_STEP_SUMMARY"

  timings:
    name: Record timing history
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.test.result == 'success' }}
    runs-on: ${{ fromJSON(inputs.helper-runner) }}
    permissions:
      contents: write                   # force-pushes the ci-timings orphan branch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: parts
          pattern: testshards-out-*
      - name: Merge into the ci-timings orphan branch (latest value wins)
        run: |
          set -euo pipefail
          mkdir -p merged
          if git ls-remote --exit-code --heads origin ci-timings >/dev/null 2>&1; then
            git fetch --depth=1 origin ci-timings
            git show FETCH_HEAD:timings.tsv > merged/timings.tsv 2>/dev/null || : > merged/timings.tsv
          else
            : > merged/timings.tsv
          fi
          find parts -name 'timings-*.tsv' -exec cat {} + >> merged/timings.tsv || true
          awk -F'\t' 'NF==2{t[$1]=$2} END{for (k in t) print k"\t"t[k]}' \
            merged/timings.tsv | sort > merged/final.tsv
          rows=$(wc -l < merged/final.tsv)
          if [ "$rows" -lt 1 ]; then
            echo "::error::0 timing rows from a green run — TESTSHARDS_OUT is not reaching the sandbox, and the shards would round-robin forever without saying so."
            exit 1
          fi
          echo "Merged $rows timing rows."
          tmp=$(mktemp -d); cp merged/final.tsv "$tmp/timings.tsv"; cd "$tmp"
          git init -q
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git checkout -q -b ci-timings
          git add timings.tsv
          git commit -q -m "ci: refresh test timings ($rows rows) [skip ci]"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-timings

  gate:
    name: All shards passed
    needs: test
    if: always()
    runs-on: ${{ fromJSON(inputs.helper-runner) }}
    steps:
      - run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::one or more shards failed (${{ needs.test.result }})"; exit 1
          fi
          echo "All shards green."
