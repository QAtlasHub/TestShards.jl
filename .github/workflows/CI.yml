name: CI

# TestShards' own suite runs through TestShards, sharded 8 ways — the package is its own
# reference deployment. The reference is LOCAL (`./.github/...`), not `@main`, so a pull
# request exercises the version of the reusable workflow it is changing rather than the one
# already merged. A bug in the reusable therefore fails its own PR, which is the point.
on:
  push:
    branches: [main]
    tags: '*'
  pull_request:
  workflow_dispatch:
    inputs:
      steal:
        description: 'Claim work instead of pre-assigning it — for comparing the two on this suite.'
        type: boolean
        default: false
      shards:
        description: 'Shard count. Fewer shards means a bigger share per shard, which is the variable that decides whether stealing is worth anything.'
        type: string
        default: '8'
      stagger:
        description: 'Delay shard sK by (K-1) x this. Makes the arrival spread controlled instead of whatever the queue happened to give.'
        type: string
        default: '0'
      prebuild:
        description: 'Precompile once and hand it to the shards, rather than each shard doing it. Trades wall clock for runner time.'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # `contents: write` is the ceiling passed to the called workflow: its `timings` job pushes
    # the ci-timings orphan branch. Granting less makes the run fail to START.
    permissions:
      contents: write
    uses: ./.github/workflows/sharded-tests.yml
    with:
      shards: ${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.shards) || 8 }}
      stagger-seconds: ${{ github.event_name == 'workflow_dispatch' && inputs.stagger || '0' }}
      prebuild: ${{ github.event_name == 'workflow_dispatch' && inputs.prebuild }}
      # Off for pushes and pull requests, so the recorded history and the required checks stay
      # on one strategy. Dispatch the workflow to run the other one: the input exists because
      # "we shipped stealing" and "stealing helped this suite" are different claims, and the
      # second needs the two measured against each other rather than swapped and hoped for.
      steal: ${{ github.event_name == 'workflow_dispatch' && inputs.steal }}
      # …and the same reason applies to the PACKAGE, not just to the workflow file. The collect
      # job's reporting steps ARE TestShards, and the default spec installs it from `main`, so
      # a pull request that adds a reporting function would run a workflow that calls it
      # against a copy of the package that does not have it — which is exactly how this line
      # came to be written. `path="."` is the checkout this run is testing.
      testshards-spec: 'path="."'
    secrets: inherit

  # The sharded path runs on one Julia version. Compatibility across the supported range is a
  # different question, so it is asked separately and unsharded — a version matrix times a
  # shard matrix would be 8N jobs to answer a question that does not need the split.
  compat:
    name: julia ${{ matrix.julia }} (unsharded)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.10']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
