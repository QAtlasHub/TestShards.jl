name: Upload TestShards coverage
description: >
  Upload the merged coverage report produced by sharded-tests.yml to Codecov, from the caller's
  own repository — for when the caller's CODECOV_TOKEN does not reach the reusable workflow.

# WHY THIS IS AN ACTION AND NOT PART OF THE WORKFLOW
#
# An action's steps run inside the CALLING job, so a secret passed to it never crosses anything.
# A reusable workflow's jobs do not, and a secret does not always survive that call. Measured
# across four callers of one reusable, same named `secrets:` block, one variable at a time:
#
#   same organisation,  public    arrives
#   other organisation, public    arrives
#   same organisation,  private   arrives
#   other organisation, private   EMPTY
#
# So it is the COMBINATION — a private caller reaching into another organisation — and neither
# condition alone predicts it. `secrets: inherit` and a named secret behave identically; the form
# is not what does it, and the caller's own job demonstrably holds the value.
#
# `codecov/codecov-action` is the existence proof for the fix: a different organisation's
# action, receiving that same token without trouble, in the very run whose reusable-workflow
# call did not.
#
# So the split is not arbitrary. The workflow owns what needs JOBS — the shard matrix, and
# merging N shards' counters into one report. This owns the last step, which needs a SECRET.

inputs:
  codecov-token:
    # Do NOT write an example expression here. A description is TEMPLATE TEXT, not a comment:
    # GitHub evaluates any expression in it when it loads the action, and `secrets` is not a
    # context an action has. Spelling out the intended value cost the whole action —
    # "Unrecognized named-value: 'secrets'" at load, so every step failed before the first one
    # ran, in the consumer rather than here. The docs are where the example belongs.
    description: >
      Your Codecov token, passed by the caller from its own secrets. An EMPTY value is a
      supported state, not a mistake: the report is merged and published either way, and only
      the sending is skipped. Hence not `required`.
    required: false
    default: ''
  artifact:
    description: 'Artifact holding the merged report. Only change this if you renamed it.'
    required: false
    default: testshards-lcov
  fail-on-error:
    description: >
      Fail the job if the upload fails. Off by default, matching the workflow: a flaky upload
      should not redden a green suite. The step says so either way.
    required: false
    default: 'false'
  flags:
    description: 'Codecov flags, comma-separated. Empty for none.'
    required: false
    default: ''
  dry-run:
    description: >
      Do everything except send the report. Exists so this action can be exercised by a suite
      that already uploads its coverage another way — an action that nothing invokes is an
      action whose next syntax error ships.
    required: false
    default: 'false'
  submodules:
    description: >
      Passed to this action's checkout: `false`, `true`, or `recursive`. Set it to whatever your
      own CI uses if any of the SOURCES the report covers live in a submodule — Codecov builds
      the report's file network from the checked-out tree, so a file that is not there is a file
      the report cannot place. Same input, same meaning, as the workflow's.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # An empty token is a CERTAIN failure, not a flaky one: Codecov rejects a tokenless upload
    # during server-side processing, after the uploader has already succeeded at queueing it, so
    # the attempt costs a red `failed:` line in the log under a green check and achieves nothing.
    #
    # So it is not attempted. This step records the reason as one plain line and sets an output
    # the upload below is gated on. Deliberately NOT a `::warning::`: for a repository that has
    # decided not to hold a Codecov token, a per-run annotation is nagging about a settled
    # decision, and an annotation nobody acts on is how annotations stop being read. The line is
    # in the log for whoever goes looking, the step summary says it once, and the merged report
    # is still published as an artifact — so nothing is lost except the sending.
    #
    # Two independent things produce an empty token, and the message names both because they
    # have different fixes: an ORGANISATION secret is withheld from a PRIVATE repository on a
    # free plan (so a private repo needs its own), and a secret does not always survive the call
    # into a reusable workflow in another repository (so the caller has to do the sending, which
    # is what this action is for).
    - name: Is there a token?
      id: token
      shell: bash
      env:
        TOKEN: ${{ inputs.codecov-token }}
      run: |
        set -euo pipefail
        if [ -z "${TOKEN:-}" ]; then
          echo "have=false" >> "$GITHUB_OUTPUT"
          echo "No Codecov token, so the report is not being sent. It is merged and published as the '${{ inputs.artifact }}' artifact either way."
          echo "Two things produce an empty token here, and they have different fixes. (1) An ORGANISATION secret does not reach a PRIVATE repository on a free plan, so such a repo needs a CODECOV_TOKEN of its own. (2) A PRIVATE repository cannot pass a secret into a reusable workflow at all, which is what this action exists to work around — if you are seeing this from inside this action, (1) is the one to check."
          echo "Coverage merged but **not uploaded** — no Codecov token. The percentage is in this run's \`Coverage\` summary above, and the report itself is the \`${{ inputs.artifact }}\` artifact." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "have=true" >> "$GITHUB_OUTPUT"
        fi

    # A checkout is not optional, and its absence is invisible from the run. Codecov builds the
    # report's file "network" from the checked-out tree, and a report uploaded without one is
    # rejected during server-side PROCESSING — which succeeds as far as the uploader can see,
    # because the upload is only queued. This is the same failure the workflow's own collect job
    # was fixed for; do not "simplify" it away.
    #
    # Unconditional, and therefore FIRST among the steps that touch the workspace: checkout
    # cleans it, so anything this action fetches has to come after. Give this action a job of its
    # own rather than appending it to one that has already built something there.
    - uses: actions/checkout@v7
      with:
        submodules: ${{ inputs.submodules }}

    # ABSENT and EMPTY are different states and get different treatment. This download is by
    # `name:`, which HARD-FAILS when the artifact does not exist — unlike the workflow's own
    # `pattern:` download, which succeeds with zero results. So an account that cannot create
    # artifacts at all turned this job red at the download, before anything about coverage was
    # even attempted:
    #
    #   Unable to download artifact(s): Artifact not found for name: testshards-lcov
    #
    # An artifact that was never created is an infrastructure state — the run's own storage quota
    # is enforced at `CreateArtifact`, before any bytes are sent, so no producer error is
    # involved and there is nothing here to fix by failing. Losing the coverage REPORT is the
    # correct degradation; losing the TEST RESULT to it is not.
    - id: fetch
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact }}

    - shell: bash
      run: |
        set -euo pipefail
        if [ "${{ steps.fetch.outcome }}" != "success" ]; then
          echo "::warning::${{ inputs.artifact }} does not exist, so there is no merged report to send. Coverage is not reported for this run; the tests themselves are unaffected. The usual cause is that the run could not create artifacts at all — an Actions storage quota is enforced at CreateArtifact, before any bytes are sent, so it stops a 0-byte artifact exactly as it stops a large one."
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "Not reported: \`${{ inputs.artifact }}\` was not produced by the run." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        # PRESENT BUT EMPTY is a different thing entirely: something produced the artifact and put
        # no report in it. That is a producer bug and stays fatal.
        [ -s lcov.info ] || { echo "::error::${{ inputs.artifact }} exists but contained no lcov.info — did the sharded run finish with coverage on?"; exit 1; }
        echo "Merged report: $(grep -c '^SF:' lcov.info) source files."

    - uses: codecov/codecov-action@v7
      if: ${{ steps.token.outputs.have == 'true' && steps.fetch.outcome == 'success' }}
      continue-on-error: ${{ inputs.fail-on-error != 'true' }}
      with:
        files: lcov.info
        # Without this the CLI also auto-discovers anything else lying around and turns one
        # merged report into several uploads of the same coverage.
        disable_search: true
        token: ${{ inputs.codecov-token }}
        flags: ${{ inputs.flags }}
        fail_ci_if_error: ${{ inputs.fail-on-error }}
        dry_run: ${{ inputs.dry-run }}
